# 7. Safety only, plus buyers outnumber sellers 1.5 to 1 and the price is up, 2 to 5 minutes
# after graduation. A token where sells outnumber buys never passes the 1.5x rule.
name: Buyers not leaving
lane: B
order: 7
description: The safety rules, and 2 to 5 minutes after graduation 5-minute buys are at least 1.5x sells and the 5-minute price change is above zero.
size_sol: 0.5

entry:
  signal: rules
  rules_checked_from_minutes: 2
  min_minutes_after_migration: 2
  max_minutes_after_migration: 5
  require:
    mint_revoked_onchain: true      # the Safety only rules
    freeze_revoked_onchain: true
    max_top10_pct: 30
    no_bot_volume: true
    min_buys_per_sell_m5: 1.5
    price_up_m5: true

# Default exits, the same as the baselines.
exits:
  take_profit:
    - {multiple: 2, sell_fraction: 0.5}   # sell half at 2x the entry price
  trailing_stop_pct: 30                   # on the rest: sell when 30% below the highest price since entry
  trailing_after_take_profit: true        # the trailing stop only starts once the first half is sold
  hard_stop_pct: 40                       # sell everything 40% below the entry price
  time_stop_hours: 24                     # sell whatever is left 24 hours after entry
