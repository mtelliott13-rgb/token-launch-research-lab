# Theme tags. Each token gets one tag from its name and description (when we have one).
# The ticker symbol is not used: tickers are often initials, and "AI" for "Apple Inu" is not an AI token.
# Themes are tried from top to bottom and the first one that matches wins, so "Trump Dog" is
# political and "AI Cat" is an AI character. A token that matches nothing is "other".
#
#   words     must appear as a whole word (or phrase): "cat" matches "Fat Cat" and "FatCat",
#             but not "catalyst". Use this for short or ambiguous words.
#   contains  may appear anywhere, even inside a longer word: "trump" matches "TRUMPCOIN".
#             Use this only for distinctive words.
#
# Edit freely: every token is re-tagged the next time the app starts after this file changes.
political:
  words: [maga, potus, president, election, vote, senate, congress, democrat, democrats, republican, republicans,
          gop, tariff, tariffs, vance, barron, ivanka, harris, pelosi, bernie, rfk, kennedy, desantis, newsom,
          aoc, modi, xi jinping, milei, netanyahu, zelensky, kim jong, white house, whitehouse, nato, iran, israel,
          ukraine, russia, hormuz, communist, fascist, epstein, hitler, mussolini, stalin, lenin, mao, kirk,
          doge department, government, congressman, senator, governor, mayor, politics, political, liberal,
          conservative, patriot, america first]
  contains: [trump, biden, kamala, obama, putin, melania, clinton]
