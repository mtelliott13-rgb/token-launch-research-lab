# Meme Radar settings. Edit and restart `uv run python -m radar` to apply.

server:
  host: 127.0.0.1        # local only; do not expose this to the network
  port: 8000

database:
  path: data/radar.db

logging:
  dir: data/logs
  level: INFO

sources:
  pumpportal:
    url: wss://pumpportal.fun/api/data
    reconnect_min_s: 1
    reconnect_max_s: 30         # longest wait between reconnect attempts; it never stops trying
    stale_after_s: 120          # reconnect if nothing arrives for this long
    # A period with no launches arriving is saved as an outage when the connection dropped, or
    # when the silence lasted at least this long (launches normally arrive every second or two).
    outage_min_gap_s: 60
  dexscreener:
    base_url: https://api.dexscreener.com
    pairs_per_min: 120          # documented limit ~300/min on token/pair endpoints
    profiles_per_min: 20        # documented limit ~60/min on profile/boost endpoints
    profiles_poll_s: 60
    boosts_poll_s: 60
    batch_size: 30              # max addresses per /tokens/v1 call
    max_batches_per_cycle: 6
    cycle_s: 5
  geckoterminal:
    base_url: https://api.geckoterminal.com/api/v2
    per_min: 8                  # documented 30/min; keyless traffic may get less
    new_pools_poll_s: 60
    trending_poll_s: 120
    ohlcv_cache_s: 45
    ohlcv_limit: 300
  rugcheck:
    base_url: https://api.rugcheck.xyz/v1
    per_min: 12
    cache_s: 900                # reuse a report for this long
    recheck_s: 1800             # re-check tokens that stay on the Rising list
    rising_top_n: 50            # how many Rising tokens get a safety check (the whole list)
    max_queue: 200
    no_report_retry_s: [600, 3600]  # RugCheck has no report: ask again after 10 min, then 1 hour, then stop
    error_retry_s: 120          # RugCheck unreachable: leave that token alone for this long

# Phase 2: follow-up checks. Every token is looked up again on DexScreener at each of these
# ages (seconds since we first saw it), even after the live refresh below has given up on it.
# The outcome columns use the names 1h, 24h, 72h and 7d, so keep those.
followups:
  checkpoints: {1m: 60, 5m: 300, 15m: 900, 1h: 3600, 4h: 14400, 24h: 86400, 72h: 259200, 7d: 604800}
  # A check still counts if it is made up to half the checkpoint's age late (so 1h may be
  # checked up to 1h30), but never less than min_late_s or more than max_late_s late.
  # Anything later is recorded as "skipped".
  late_fraction: 0.5
  min_late_s: 60
  max_late_s: 21600
  step_in_s: 30                 # give the live refresh this long to make the check for free first
  cycle_s: 5
  max_batches_per_cycle: 2      # about 20 requests/min at most, on top of the live refresh
  scan_limit: 3000
  priority_mcap_usd: 15000      # when behind: graduated first, then tokens above this, then the rest

# Phase 2: outcome labels, computed from p0 = the first price we saw for a token.
outcomes:
  rug_drop_pct: 90              # "rug": price or pool liquidity falls this much...
  rug_window_s: 3600            # ...within this long
  rug_min_liquidity_usd: 1000   # ignore liquidity drops from pools smaller than this
  dead_vol_h24_usd: 1000        # "dead": 24h volume under this at day 7
  runner_multiple: 3            # "runner": peak in the first 24h is 3x to 10x p0
  moonshot_multiple: 10         # "moonshot": 10x or more

# "Why it's rising": what stands out about each token on the Rising list, from data we collect.
why:
  cache_s: 30                   # reuse a token's analysis for this long
  lookback_s: 3600              # liquidity change is measured over this long
  min_cohort: 10                # need this many Rising tokens before saying how unusual a figure is
  top_drivers: 3                # how many drivers the explanation names
  # A driver counts once its figure reaches `notable`; at `strong` it is as strong as it gets.
  drivers:
    volume_acceleration: {notable: 1.5, strong: 4}      # 5m volume vs the hourly pace (1 = steady)
    txn_growth: {notable: 1.5, strong: 4}               # 5m trades vs the hourly pace
    buy_pressure_m5: {notable: 0.6, strong: 0.85}       # share of 5m trades that were buys
    buy_pressure_h1: {notable: 0.55, strong: 0.75}      # share of 1h trades that were buys
    price_change_m5: {notable: 5, strong: 30}           # percent
    price_change_h1: {notable: 20, strong: 150}         # percent
    mcap_multiple: {notable: 2, strong: 10}             # price now vs the first price we saw
    holder_growth: {notable: 20, strong: 200}           # percent, since our first safety check
    liquidity_change: {notable: 15, strong: 100}        # percent, over lookback_s
  recent_graduation_min: 60     # "just graduated" for this long after leaving the bonding curve
  warnings:
    top10_pct: 30               # top-10 holders own at least this share of supply
    top10_pct_high: 50
    creator_pct: 5              # the creator's wallet still holds at least this share
    liquidity_drop_pct: 20      # pool liquidity fell this much over lookback_s
    mcap_to_liquidity: 100      # market cap is this many times the pool liquidity
  # Base rates: how tokens that first appeared on Rising with the same pattern ended.
  base_rates:
    min_n: 100                  # complete outcomes needed before a pattern's history is shown
    refresh_s: 900
    hold_peak: 1.5              # median peak after appearing >= this: "usually had further to run"
    fade_peak: 1.2              # median peak after appearing < this: "usually near its top"
  entry_settle_s: 300           # a new Rising entry may still gain its safety check for this long

# Patterns page: themes and launch times compared by graduation rate, peak and fate.
# Only pump.fun launches we saw being created, with a complete outcome, are counted.
patterns:
  min_complete: 5000            # below this many complete outcomes the page says the data is not ready
  min_group_n: 300              # a row with fewer tokens than this is marked as too small to compare
  cache_s: 300

# Data retention. Once a token's 7d follow-up is in and its outcome is final, we decide once
# what to keep of its snapshots:
#   kept    all snapshots stay: it graduated, reached keep_min_peak_mcap_usd, or is watched
#   early   the first early_keep_hours of snapshots stay, whether it won or lost: a strategy
#           could plausibly have picked it (it appeared on Rising or reached
#           selectable_min_peak_mcap_usd) but it does not qualify for "kept"
#   pruned  all snapshots are deleted: it never reached any of the above
# Whatever the verdict, the token itself, its outcome, its follow-up checkpoint rows (price,
# market cap, liquidity, volume, buys/sells at 1m ... 7d), its raw launch event and any safety
# reports all stay. Deleted snapshots cannot be brought back. Set enabled to false to keep everything.
retention:
  enabled: true
  after_days: 7
  keep_min_peak_mcap_usd: 30000
  selectable_min_peak_mcap_usd: 10000
  early_keep_hours: 4
  interval_s: 300
  batch: 500                    # tokens judged per pass

# Token descriptions. A pump.fun token's description is in a small file its creator uploaded
# (its "metadata link"). We fetch it once, only for tokens worth the request: on Rising,
# graduated, or at min_mcap_usd or more. The token's theme tag is then worked out again.
# These links are chosen by anonymous creators, so we only fetch from the places listed here:
# files stored on IPFS are read through our own choice of gateway, and other links must be
# https on one of allowed_hosts. Everything else is recorded as skipped.
descriptions:
  enabled: true
  min_mcap_usd: 10000
  per_min: 20                   # all hosts together
  max_bytes: 65536
  ipfs_gateways:                # tried in order; ipfs.io itself stopped serving direct requests (2026-10)
    - https://ipfs.filebase.io/ipfs/
    - https://gateway.pinata.cloud/ipfs/
  allowed_hosts: [metadata.j7tracker.io, meta.uxento.io]
  batch: 10
  cycle_s: 15
  max_tries: 3                  # for failures that might pass (timeouts, server errors)
  retry_s: 900

# On-chain check. For every token on Rising we read its mint and freeze authority straight
# from the chain, and that reading replaces RugCheck's wherever the two differ.
# One batched call covers up to 100 tokens. The public endpoint is free and needs no key;
# its published limit is 40 requests per 10 seconds for one method, far above what this uses.
onchain:
  enabled: true
  url: https://api.mainnet-beta.solana.com
  per_min: 6                    # our own ceiling
  cycle_s: 60                   # at most one call a minute
  recheck_s: 1800               # each token is checked at most this often
  batch: 100

# How often each token's pair data is re-fetched from DexScreener (seconds).
# A token that matches no rule stops being refreshed; the follow-up checks above still happen.
refresh:
  first_delay_s: 20             # wait after creation so DexScreener has indexed it
  watched_s: 10
  featured_s: 30                # trending, Rising, recently boosted/profiled, just graduated
  featured_migrated_window_s: 3600
  featured_trending_window_s: 600
  featured_rising_window_s: 120
  featured_promo_window_s: 3600
  fresh_age_s: 600
  fresh_s: 60
  young_age_s: 3600
  young_alive_s: 120
  young_quiet_s: 600
  day_alive_s: 300
  day_quiet_migrated_s: 1800
  max_age_s: 86400
  alive_min_txns_h1: 5
  max_misses: 6                 # give up after DexScreener returns nothing this many times

# Momentum score v0. Documented in the dashboard; to be tuned with backtests later.
momentum:
  weights:
    volume_acceleration: 0.4
    buy_pressure: 0.3
    txn_growth: 0.3
  volume_floor_usd: 100         # floor for hourly volume, avoids divide-by-tiny
  txn_floor: 1                  # floor for the average 5-minute transaction count

# "Likely bot volume" flag: many trades in the last hour while the price went nowhere.
# Version 0, not yet tested against outcomes. Percentages are DexScreener's price change figures.
bot_volume:
  min_txns_h1: 300
  max_abs_price_chg_h1: 1.0
  max_abs_price_chg_m5: 1.0
  max_mcap_usd: 1000000         # only judge tokens under this market cap; bigger ones are flat for honest reasons

rising:
  min_liquidity_usd: 10000      # for tokens with a liquidity pool
  min_curve_mcap_usd: 15000     # for tokens still on the bonding curve (no pool liquidity yet)
  min_age_min: 3
  min_txns_m5: 10
  max_snapshot_age_s: 180       # ignore tokens whose data is older than this
  # This is a meme coin radar: stablecoins and major tokens are kept off the Rising list.
  # Anything above max_mcap_usd is left out, and so is every address in exclude_mints
  # whatever its market cap. They are still recorded in the database.
  max_mcap_usd: 50000000
  exclude_mints:
    - EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v    # USDC
    - Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB    # USDT
    - So11111111111111111111111111111111111111112     # SOL (wrapped)
    - JUPyiwrYJFskUPiHa7hkeR8VUtAeFoSYbKedZNsDvCN     # JUP
    - pumpCmXqMfrsAkQ5r49WcJnRayYRqmXz6ae8H7H9Dfn     # PUMP
    - ukHH6c7mMyiWCf1b9pnWe25TSpkDDt3H5pQZgZ74J82     # BOME
    - DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263    # BONK
    - EKpQGSJtjMFqKZ9KQanSqYXRcF8fBopzLHYxdM65zcjm    # WIF
    - 6p6xgHyF7AeE6TZkSmFsko444wqoP15icUSqi2jfGiPN    # TRUMP
    - 2zMMhcVQEXDtdE6vsFS7S7D5oUodfJHE8vd1gnBouauv    # PENGU
    - 9BB6NFEcjBCtnNLFko2FqVQBq8HHM13kCyYcdQbgpump    # Fartcoin
    - 3NZ9JMVBmGAqocybic2c7LQCJScmgsAZ6vQqTDzcqmJh    # WBTC (Wormhole)
    - cbbtcf3aa214zXHbiAZQwf4122FBYbraNdFqgw4iMij     # cbBTC
    - 7vfCXTUXx5WJV5JADk17DUJ4ksgau7utNKj4b963voxs    # WETH (Wormhole)
  limit: 50
  refresh_s: 10

dashboard:
  launches_limit: 200
  default_filters:
    min_liquidity_usd: 0
    max_top10_pct: 100
    hide_authority: false
    graduated_only: false
