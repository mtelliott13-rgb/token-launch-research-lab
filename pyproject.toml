[project]
name = "meme-radar"
version = "0.1.0"
description = "Solana meme coin research dashboard (local, read-only, no trading)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "websockets>=13",
    "pyyaml>=6",
    "certifi",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
