[project]
name = "token-launch-research-lab"
version = "0.1.0"
description = "Solana token launch research dashboard and paper-trading lab (local, read-only, no real trading)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "websockets>=13",
    "pyyaml>=6",
    "certifi",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
